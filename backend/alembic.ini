# Configuration Alembic (backend)
# L'URL réelle est injectée par alembic/env.py depuis la configuration de l'app.

[alembic]
script_location = alembic
prepend_sys_path = .
# Remplacé par app.core.config.settings.database_url dans alembic/env.py
sqlalchemy.url = postgresql+psycopg://manuscript:change_me@localhost:5432/manuscript_ai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S