# Secure Manuscript Intelligence Platform
# Démarrage : docker compose up --build
# Le fichier .env (racine) fournit les secrets ; les valeurs ci-dessous
# adaptent les hôtes internes au réseau Docker.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manuscript}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-manuscript_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manuscript}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 9000 (S3) est souvent pris par Docker Desktop sur Windows :
    # l'API MinIO est exposée sur le port hôte 9010, la console sur 9001.
    # (Les services internes joignent MinIO via minio:9000, inchangé.)
    ports:
      - "9010:9000"
      - "9001:9001"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-manuscript}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-manuscript_ai}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  miniodata: