server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : fallback vers index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend FastAPI.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;

        # Le pipeline d'analyse appelle Gemini (extraction + analyse) et peut
        # dépasser 1 minute (retries 429/503). Le défaut nginx est 60 s -> 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Cache des assets versionnés par Vite.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}